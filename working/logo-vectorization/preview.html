<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIN DESIGN SVG Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #0f1012;
      color: #f5f5f5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      width: min(1120px, 100%);
      display: grid;
      gap: 24px;
    }
    section {
      border: 1px solid #2a2d32;
      background: #15171a;
      padding: 16px;
    }
    h1, h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    .frame {
      background: #101113;
      display: grid;
      place-items: center;
      min-height: 280px;
      overflow: hidden;
    }
    img {
      width: 100%;
      max-width: 1040px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <h1>LIN DESIGN SVG Preview</h1>
    <section>
      <h2>Clean editable</h2>
      <div class="frame">
        <img src="./lin-design-clean-editable.svg" alt="Clean editable SVG">
      </div>
    </section>
    <section>
      <h2>Traced-style high detail</h2>
      <div class="frame">
        <img src="./lin-design-traced-style.svg" alt="Traced-style SVG">
      </div>
    </section>
  </main>
</body>
</html>
